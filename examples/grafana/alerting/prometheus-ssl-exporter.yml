            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              datasource:
                type: prometheus
                uid: DS_PROMETHEUS
              editorMode: code
              expr: "ssl_target_up{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"} == 1 and ssl_target_valid{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"} == 0"
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
