      - uid: ssl-file-source-down
        title: SslFileSourceDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              datasource:
                type: prometheus
                uid: DS_PROMETHEUS
              editorMode: code
              expr: "ssl_file_up{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"} == 0"
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
