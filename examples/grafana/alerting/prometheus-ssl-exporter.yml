              datasource:
                type: prometheus
                uid: DS_PROMETHEUS
              editorMode: code
              expr: "increase(ssl_file_read_errors_total{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"}[30m]) > 0 or max_over_time(ssl_target_consecutive_failures{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"}[30m]) >= 3"
