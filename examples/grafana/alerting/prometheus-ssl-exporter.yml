          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              datasource:
                type: prometheus
                uid: DS_PROMETHEUS
              editorMode: code
              expr: "increase(ssl_file_parse_errors_total{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"}[30m]) > 0 or increase(ssl_target_parse_errors_total{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"}[30m]) > 0"
