          summary: "SSL file source is unavailable"
          description: "prometheus-ssl-exporter cannot read one or more configured certificate files on {{ $labels.instance }}."
        labels:
          severity: warning
        isPaused: false

      - uid: ssl-file-source-invalid
        title: SslFileSourceInvalid
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              datasource:
                type: prometheus
                uid: DS_PROMETHEUS
              editorMode: code
              expr: "ssl_file_up{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"} == 1 and ssl_file_valid{job=~\"^(prometheus[_-])?ssl[_-]exporter$\"} == 0"
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "SSL file source is readable but invalid"
          description: "prometheus-ssl-exporter can read configured certificate files on {{ $labels.instance }}, but at least one file did not produce valid certificate data."
        labels:
          severity: warning
        isPaused: false

      - uid: ssl-target-source-down
        title: SslTargetSourceDown
        condition: C
