groups:
  # IMPORTANT: Replace the job matcher when your Prometheus scrape job uses a custom name.
  # Default matcher: job=~"^(prometheus[_-])?ssl[_-]exporter$"
  - name: prometheus-ssl-exporter
    rules:
      - alert: PrometheusSslExporterDown
        expr: up{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: prometheus-ssl-exporter is down
          description: Prometheus cannot scrape prometheus-ssl-exporter.

      - alert: SslExporterCollectionStale
        expr: ((time() - ssl_exporter_last_successful_collection_timestamp_seconds{job=~"^(prometheus[_-])?ssl[_-]exporter$"}) and ssl_exporter_last_successful_collection_timestamp_seconds{job=~"^(prometheus[_-])?ssl[_-]exporter$"} > 0) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SSL exporter collection is stale
          description: Last successful SSL collection was more than 5 minutes ago.

      - alert: SslExporterCollectionFailed
        expr: ssl_exporter_last_collection_success{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL exporter collection failed
          description: Last SSL certificate collection finished with errors.

      - alert: SslCertificateNotYetValid
        expr: ssl_certificate_temporarily_valid{job=~"^(prometheus[_-])?ssl[_-]exporter$",chain_index="0"} == 0 and ssl_certificate_expires_in_seconds{job=~"^(prometheus[_-])?ssl[_-]exporter$",chain_index="0"} >= 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL certificate is not yet valid
          description: SSL certificate for {{ $labels.target }} has a NotBefore timestamp in the future.

      - alert: SslCertificateCheckFailed
        expr: ssl_check_success{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL certificate check failed
          description: SSL check (connection or certificate) failed for {{ $labels.source }} {{ $labels.target }}.

      - alert: SslCertificateChainVerificationFailed
        expr: ssl_certificate_chain_verified{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL certificate chain verification failed
          description: TLS certificate chain verification failed for {{ $labels.source }} {{ $labels.target }}.

      - alert: SslCertificateExpiresSoon
        expr: ssl_certificate_expires_in_seconds{job=~"^(prometheus[_-])?ssl[_-]exporter$",chain_index="0"} < 14 * 24 * 60 * 60 and ssl_certificate_expires_in_seconds{job=~"^(prometheus[_-])?ssl[_-]exporter$",chain_index="0"} >= 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: SSL certificate expires soon
          description: SSL certificate for {{ $labels.target }} expires in less than 14 days.

      - alert: SslCertificateExpiresCritical
        expr: ssl_certificate_expires_in_seconds{job=~"^(prometheus[_-])?ssl[_-]exporter$",chain_index="0"} < 2 * 24 * 60 * 60 and ssl_certificate_expires_in_seconds{job=~"^(prometheus[_-])?ssl[_-]exporter$",chain_index="0"} >= 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: SSL certificate expires very soon
          description: SSL certificate for {{ $labels.target }} expires in less than 2 days.

      - alert: SslCertificateExpired
        expr: ssl_certificate_expires_in_seconds{job=~"^(prometheus[_-])?ssl[_-]exporter$",chain_index="0"} < 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: SSL certificate expired
          description: SSL certificate for {{ $labels.target }} is expired.

      - alert: SslFileSourceDown
        expr: ssl_file_up{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL file source is unavailable
          description: prometheus-ssl-exporter cannot read one or more configured certificate files on {{ $labels.instance }}.

      - alert: SslFileSourceInvalid
        expr: ssl_file_up{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 1 and ssl_file_valid{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL file source is readable but invalid
          description: prometheus-ssl-exporter can read configured certificate files on {{ $labels.instance }}, but at least one file did not produce valid certificate data.

      - alert: SslTargetSourceDown
        expr: ssl_target_up{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL target source is unavailable
          description: prometheus-ssl-exporter cannot collect one or more configured TLS targets on {{ $labels.instance }}.

      - alert: SslTargetSourceInvalid
        expr: ssl_target_up{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 1 and ssl_target_valid{job=~"^(prometheus[_-])?ssl[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL target source is readable but invalid
          description: prometheus-ssl-exporter collected configured TLS targets on {{ $labels.instance }}, but at least one target did not produce valid certificate data.

      - alert: SslSourceReadErrors
        expr: >-
          increase(ssl_file_read_errors_total{job=~"^(prometheus[_-])?ssl[_-]exporter$"}[30m]) > 0
          or increase(ssl_target_read_errors_total{job=~"^(prometheus[_-])?ssl[_-]exporter$"}[30m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: SSL source read errors observed
          description: prometheus-ssl-exporter observed one or more file read or target collection errors in the last 30 minutes.

      - alert: SslSourceParseErrors
        expr: >-
          increase(ssl_file_parse_errors_total{job=~"^(prometheus[_-])?ssl[_-]exporter$"}[30m]) > 0
          or increase(ssl_target_parse_errors_total{job=~"^(prometheus[_-])?ssl[_-]exporter$"}[30m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: SSL source parse errors observed
          description: prometheus-ssl-exporter observed one or more certificate parse errors in the last 30 minutes.
