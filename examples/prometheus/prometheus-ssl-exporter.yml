groups:
  - name: prometheus-ssl-exporter
    rules:
      - alert: PrometheusSslExporterDown
        expr: up{job="ssl-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: prometheus-ssl-exporter is down
          description: Prometheus cannot scrape prometheus-ssl-exporter.

      - alert: SslCertificateCheckFailed
        expr: ssl_check_success{job="ssl-exporter"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL certificate check failed
          description: SSL certificate check failed for {{ $labels.source }} {{ $labels.target }}.

      - alert: SslCertificateChainVerificationFailed
        expr: ssl_certificate_chain_verified{job="ssl-exporter"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SSL certificate chain verification failed
          description: TLS certificate chain verification failed for {{ $labels.source }} {{ $labels.target }}.

      - alert: SslCertificateExpiresSoon
        expr: ssl_certificate_expires_in_seconds{job="ssl-exporter",chain_index="0"} < 14 * 24 * 60 * 60 and ssl_certificate_expires_in_seconds{job="ssl-exporter",chain_index="0"} >= 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: SSL certificate expires soon
          description: SSL certificate for {{ $labels.target }} expires in less than 14 days.

      - alert: SslCertificateExpired
        expr: ssl_certificate_expires_in_seconds{job="ssl-exporter",chain_index="0"} < 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: SSL certificate expired
          description: SSL certificate for {{ $labels.target }} is expired.
